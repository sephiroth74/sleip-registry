name: Sleip
description: >
  Sleip, Lokyr's plugin package manager, of the build for Linux that this
  registry pins, a release of its own, checked against its SHA-256 and put
  on the PATH.

runs:
  using: composite
  steps:
    - name: Sleip, checked against its SHA-256
      shell: bash
      env:
        URL: https://github.com/sephiroth74/sleip-registry/releases/download/sleip-22b403e8a5/sleip-aarch64-linux
        SHA256: b2d0de153377ea8e4f1d901e30aa55790954f0b5b4a21daa995ff0130757cad4
      run: |
        mkdir -p "$RUNNER_TEMP/sleip"
        curl --fail --silent --show-error --location --retry 3 "$URL" --output "$RUNNER_TEMP/sleip/sleip"
        echo "$SHA256  $RUNNER_TEMP/sleip/sleip" | sha256sum --check --quiet
        chmod +x "$RUNNER_TEMP/sleip/sleip"
        echo "$RUNNER_TEMP/sleip" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/sleip/sleip" --version
