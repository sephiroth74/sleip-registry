name: Publish

# Each version of the registry that has no release yet: its archive packaged
# again from the commit that its file pins, alike, whatever became of its
# tag, and uploaded to a release of its own, `<owner>.<name>.<version>`,
# which stays as it was once made. It runs no plugin's code: the archive is
# the commit's files alone. Each version on its own: one that fails, as of
# a repository or a commit gone, is told, the next released, and the job
# fails at its end; the schedule tries again. A yanked version of no
# release is skipped: a yank ends a version that can no longer be built.
on:
  push:
    branches: [main]
    paths: ["plugins/**"]
  schedule:
    - cron: "41 */6 * * *"
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    # One at a time, each to its end, so that no release is made twice.
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - name: The registry, as main has it now
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Sleip
        uses: ./.github/actions/sleip

      - name: The releases of the versions that have none
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sleip --json registry versions | jq -c 'select(.event == "version")' > versions.ndjson
          # The releases made, and the drafts that a stopped upload left.
          gh api --paginate "repos/$REPO/releases" --jq '.[] | [.tag_name, .draft] | @tsv' > releases.tsv
          failed=0
          while read -r version; do
            name=$(jq -r .name <<< "$version")
            number=$(jq -r .version <<< "$version")
            release=$(jq -r .release <<< "$version")
            archive=$(jq -r .archive <<< "$version")
            commit=$(jq -r .commit <<< "$version")
            repository=$(jq -r .repository <<< "$version")
            yanked=$(jq -r .yanked <<< "$version")
            if grep -qxF "$release"$'\tfalse' releases.tsv; then
              continue
            fi
            if [ "$yanked" = true ]; then
              echo "Skipped, yanked before its release: $name $number" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if grep -qxF "$release"$'\ttrue' releases.tsv; then
              gh release delete "$release" --repo "$REPO" --yes
            fi
            # Of `&&` alone, as a condition's commands stop at no failure
            # of `set -e`.
            if sleip --json registry build "$name" "$number" --out dist > built.ndjson \
              && cksum=$(jq -r 'select(.event == "built") | .cksum' built.ndjson) \
              && [ -n "$cksum" ] \
              && gh release create "$release" "dist/$release/$archive" --repo "$REPO" --target main \
                --title "$name $number" \
                --notes "$name $number, of $repository at $commit. The archive's checksum: $cksum."; then
              echo "Released $name $number: $cksum" >> "$GITHUB_STEP_SUMMARY"
            else
              failed=$((failed + 1))
              message=$(jq -r 'select(.event == "error") | .message' built.ndjson 2> /dev/null | head -n 1)
              message=${message:-the log of the step tells why}
              echo "::error::$name $number was not released: $message"
              echo "Not released, $name $number: $message" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < versions.ndjson
          if [ "$failed" -gt 0 ]; then
            echo "$failed versions were not released; the schedule tries again." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # The index of the versions released, signed by the index key, which the
  # environment of main alone holds; kept for the site. It runs after the
  # releases, whichever failed, as the index lists those made alone.
  index:
    name: Index
    needs: publish
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    environment: index
    permissions:
      contents: read
    concurrency:
      group: index
      cancel-in-progress: false
    steps:
      - name: The registry, as main has it now
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Sleip
        uses: ./.github/actions/sleip

      - name: The archives of the releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPO/releases" --jq '.[] | select(.draft | not) | .tag_name' > released.txt
          sleip --json registry versions | jq -c 'select(.event == "version")' > versions.ndjson
          while read -r version; do
            release=$(jq -r .release <<< "$version")
            archive=$(jq -r .archive <<< "$version")
            if grep -qxF "$release" released.txt; then
              gh release download "$release" --repo "$REPO" --pattern "$archive" --dir "archives/$release"
            fi
          done < versions.ndjson

      - name: The index, signed
        shell: bash
        env:
          SLEIP_INDEX_KEY: ${{ secrets.SLEIP_INDEX_KEY }}
        run: |
          sleip registry index --archives archives --out site
          echo "Signed the index of $(find site/index -type f | wc -l) plugins." >> "$GITHUB_STEP_SUMMARY"

      - name: The index, kept for the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: index
          path: site
          if-no-files-found: error
