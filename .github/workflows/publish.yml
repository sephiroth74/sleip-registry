name: Publish

# Each version of the registry that has no release yet: its archive packaged
# again from the commit that its file pins, alike, whatever became of its
# tag, and uploaded to a release of its own, `<owner>.<name>.<version>`,
# which stays as it was once made. It runs no plugin's code: the archive is
# the commit's files alone. Each version on its own: one that fails, as of
# a repository or a commit gone, is told, the next released, and the job
# fails at its end; the schedule tries again. A yanked version of no
# release is skipped: a yank ends a version that can no longer be built.
on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "keys.json"
      - ".github/actions/**"
      - ".github/workflows/publish.yml"
  schedule:
    - cron: "41 */6 * * *"
  workflow_call:
  workflow_dispatch:

permissions: {}

# No file of Git LFS fetched, as a package holds none.
env:
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: write
    # One at a time, each to its end, so that no release is made twice.
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - name: The registry, as main has it now
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Sleip
        uses: ./.github/actions/sleip

      # The token of the releases to `gh` alone: the archives are built
      # of the plugins' repositories in a step of none.
      # A plugin's file that does not read, or of a name that two owners
      # hold, told as failed, the others released.
      - name: The versions that have no release
        shell: bash
        run: |
          sleip --json registry versions > "$RUNNER_TEMP/listed.ndjson"
          jq -c 'select(.event == "version")' "$RUNNER_TEMP/listed.ndjson" > "$RUNNER_TEMP/versions.ndjson"
          jq -r 'select(.event == "failed") | "Not released, " + .name + ": " + .message' "$RUNNER_TEMP/listed.ndjson" >> "$GITHUB_STEP_SUMMARY"
          jq -s 'map(select(.event == "failed")) | length' "$RUNNER_TEMP/listed.ndjson" > "$RUNNER_TEMP/failed"

      - name: The releases made, and the drafts that a stopped upload left
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPO/releases" --jq '.[] | [.tag_name, .draft] | @tsv' > "$RUNNER_TEMP/releases.tsv"
          : > "$RUNNER_TEMP/todo.ndjson"
          while read -r version; do
            name=$(jq -r .name <<< "$version")
            number=$(jq -r .version <<< "$version")
            release=$(jq -r .release <<< "$version")
            if grep -qxF "$release"$'\tfalse' "$RUNNER_TEMP/releases.tsv"; then
              continue
            fi
            if [ "$(jq -r .yanked <<< "$version")" = true ]; then
              echo "Skipped, yanked before its release: $name $number" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if grep -qxF "$release"$'\ttrue' "$RUNNER_TEMP/releases.tsv"; then
              gh release delete "$release" --repo "$REPO" --yes
            fi
            echo "$version" >> "$RUNNER_TEMP/todo.ndjson"
          done < "$RUNNER_TEMP/versions.ndjson"

      - name: The archives, of the plugins' repositories
        shell: bash
        run: |
          : > "$RUNNER_TEMP/built.ndjson"
          failed=$(cat "$RUNNER_TEMP/failed")
          while read -r version; do
            name=$(jq -r .name <<< "$version")
            number=$(jq -r .version <<< "$version")
            # Of `&&` alone, as a condition's commands stop at no failure
            # of `set -e`.
            if sleip --json registry build "$name" "$number" --out "$RUNNER_TEMP/dist" > "$RUNNER_TEMP/build.ndjson" \
              && cksum=$(jq -r 'select(.event == "built") | .cksum' "$RUNNER_TEMP/build.ndjson") \
              && [ -n "$cksum" ]; then
              jq -c --arg cksum "$cksum" '. + {cksum: $cksum}' <<< "$version" >> "$RUNNER_TEMP/built.ndjson"
            else
              failed=$((failed + 1))
              message=$(jq -r 'select(.event == "error") | .message' "$RUNNER_TEMP/build.ndjson" 2> /dev/null | head -n 1)
              message=${message:-the log of the step tells why}
              echo "::error::$name $number was not built: $message"
              echo "Not released, $name $number: $message" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < "$RUNNER_TEMP/todo.ndjson"
          echo "$failed" > "$RUNNER_TEMP/failed"

      - name: The releases of the archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          failed=$(cat "$RUNNER_TEMP/failed")
          while read -r version; do
            name=$(jq -r .name <<< "$version")
            number=$(jq -r .version <<< "$version")
            release=$(jq -r .release <<< "$version")
            archive=$(jq -r .archive <<< "$version")
            commit=$(jq -r .commit <<< "$version")
            repository=$(jq -r .repository <<< "$version")
            cksum=$(jq -r .cksum <<< "$version")
            if gh release create "$release" "$RUNNER_TEMP/dist/$release/$archive" --repo "$REPO" --target main \
              --title "$name $number" \
              --notes "$name $number, of $repository at $commit. The archive's checksum: $cksum."; then
              echo "Released $name $number: $cksum" >> "$GITHUB_STEP_SUMMARY"
            else
              failed=$((failed + 1))
              echo "::error::$name $number was not released"
              echo "Not released, $name $number: its release could not be made" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < "$RUNNER_TEMP/built.ndjson"
          if [ "$failed" -gt 0 ]; then
            echo "$failed versions were not released; the schedule tries again." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # The index of the versions released, signed by the index key, which the
  # environment of main alone holds, and the site of it, searched by
  # Pagefind. It runs after the releases, whichever failed, as the index
  # lists those made alone. Of the index deployed, its lines are kept as
  # they were signed, and the new versions alone are downloaded of their
  # releases, public, of no token: an asset replaced changes no line. A
  # version that fails is told, the others published, and the run fails
  # at its end.
  index:
    name: Index
    needs: publish
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    environment: index
    permissions:
      contents: read
    outputs:
      failed: ${{ steps.failed.outputs.failed }}
    concurrency:
      group: index
      cancel-in-progress: false
    steps:
      - name: The registry, as main has it now
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Sleip
        uses: ./.github/actions/sleip

      - name: The index, signed
        shell: bash
        env:
          SLEIP_INDEX_KEY: ${{ secrets.SLEIP_INDEX_KEY }}
        run: |
          sleip --json registry index --archives "$RUNNER_TEMP/archives" --out "$RUNNER_TEMP/site" \
            --deployed https://pkg.lokyr.dev > "$RUNNER_TEMP/index.ndjson"
          cat "$RUNNER_TEMP/index.ndjson"
          echo "Signed the index of $(find "$RUNNER_TEMP/site/index" -type f | wc -l) plugins, of $(find "$RUNNER_TEMP/archives" -type f 2> /dev/null | wc -l) archives downloaded." >> "$GITHUB_STEP_SUMMARY"

      - name: The site, of a page of each plugin
        shell: bash
        run: |
          sleip --json registry site --archives "$RUNNER_TEMP/archives" --out "$RUNNER_TEMP/site" > "$RUNNER_TEMP/site.ndjson"
          cat "$RUNNER_TEMP/site.ndjson"

      - name: The versions that failed
        id: failed
        shell: bash
        run: |
          jq -r 'select(.event == "failed") | "Failed, " + .name + " " + (.version // "") + ": " + .message' \
            "$RUNNER_TEMP/index.ndjson" "$RUNNER_TEMP/site.ndjson" | head -n 100 >> "$GITHUB_STEP_SUMMARY"
          failed=$(jq -s 'map(select(.event == "failed")) | length' "$RUNNER_TEMP/index.ndjson" "$RUNNER_TEMP/site.ndjson")
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Pagefind
        uses: ./.github/actions/pagefind

      - name: The site's search
        shell: bash
        run: pagefind --site "$RUNNER_TEMP/site"

      # The README's list of the plugins, beside the README that it came
      # of, which the job of the README's pull request compares with
      # main's as it is then.
      - name: The README's list of the plugins
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/readme"
          cp README.md "$RUNNER_TEMP/readme/README.base.md"
          sleip registry readme --index "$RUNNER_TEMP/site"
          cp README.md "$RUNNER_TEMP/readme/README.md"

      - name: The README, kept for its pull request
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readme
          path: ${{ runner.temp }}/readme

      - name: The site, kept for GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  # The README's list of the plugins, of a list that changed: a pull
  # request of the workflow's own, merged at once, as main takes changes of
  # pull requests alone, which starts no other workflow; of a README that
  # main changed since the index job read it, left to the next run. Of an
  # index written, whichever release failed before it.
  readme:
    name: README
    needs: index
    if: ${{ !cancelled() && needs.index.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: readme
      cancel-in-progress: false
    steps:
      - name: The registry, as main has it now
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: The README, as the index job wrote it
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: readme
          path: ${{ runner.temp }}/readme

      - name: A pull request of the list, merged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if ! cmp -s "$RUNNER_TEMP/readme/README.base.md" README.md; then
            echo "main's README changed since the index was written: the next run lists the plugins." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if cmp -s "$RUNNER_TEMP/readme/README.md" README.md; then
            echo "The README's list of the plugins is as it was." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="readme/$RUN"
          git switch --quiet -c "$branch"
          cp "$RUNNER_TEMP/readme/README.md" README.md
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -am "The README's list of the plugins"
          git push --quiet origin "$branch"
          url=$(gh pr create --repo "$REPO" --base main --head "$branch" \
            --title "The README's list of the plugins" \
            --body "The list of the plugins, as the registry's signed index holds them, written by its CI.")
          # The branch removed by the repository as it merges.
          gh pr merge "$url" --repo "$REPO" --squash
          echo "The README's list of the plugins changed: $url" >> "$GITHUB_STEP_SUMMARY"

  # The index and the site on GitHub Pages, at pkg.lokyr.dev, of an index
  # written, whichever release failed before it.
  pages:
    name: Pages
    needs: index
    if: ${{ !cancelled() && needs.index.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: The site, on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The run fails of the versions that the index or the site told as
  # failed, once the rest is published.
  failed:
    name: The versions that failed
    needs: index
    if: ${{ !cancelled() && needs.index.outputs.failed != '' && needs.index.outputs.failed != '0' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Their number
        shell: bash
        env:
          FAILED: ${{ needs.index.outputs.failed }}
        run: |
          echo "::error::$FAILED versions failed, of the index or the site: the summary of the index job tells which; their lines signed before are kept."
          exit 1
